# nginx site for broadwaycreation.rw (AOS VPS)
# Install: sudo cp deploy/nginx/broadwaycreation.conf /etc/nginx/sites-available/broadwaycreation.rw

# After Certbot: uncomment the redirect block below so HTTP always upgrades to HTTPS.
# server {
#     listen 80;
#     listen [::]:80;
#     server_name broadwaycreation.rw www.broadwaycreation.rw;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    server_name broadwaycreation.rw www.broadwaycreation.rw;

    client_max_body_size 30M;

    # NestJS API — strip /api prefix
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.io (realtime)
    location /events/ {
        proxy_pass http://127.0.0.1:3000/events/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After Certbot, it will add a second server { listen 443 ssl; ... } block.
