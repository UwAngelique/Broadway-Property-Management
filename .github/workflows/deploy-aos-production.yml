name: Deploy AOS production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aos-production
  cancel-in-progress: true

env:
  APP_DIR: /var/www/html/Broadway-Property-Management

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, production, broadway]
    steps:
      - name: Pull latest code
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Build and restart backend
        run: |
          set -euo pipefail
          cd "$APP_DIR/backend"
          npm ci
          rm -rf dist
          npm run build
          mkdir -p dist/migrations
          npx tsc migrations/*.ts --target ES2023 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir dist/migrations
          BACKEND_ENTRY="$(find dist -name main.js | head -n 1)"
          test -n "$BACKEND_ENTRY"
          pm2 delete broadway-backend || true
          pm2 start "$BACKEND_ENTRY" --name broadway-backend --update-env

      - name: Build and restart frontend
        env:
          API_PROXY_TARGET: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          cd "$APP_DIR/frontend"
          npm ci
          npm run build
          pm2 delete broadway-frontend || true
          pm2 start "npm run start -- -p 3001" --name broadway-frontend --update-env

      - name: Save PM2 process list
        run: pm2 save

      - name: Smoke test public site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://broadwaycreation.rw/api/billing/plans)
          echo "GET /api/billing/plans -> $code"
          test "$code" = "200"
          pf=$(curl -s -o /dev/null -w '%{http_code}' http://broadwaycreation.rw/api/platform/finance)
          echo "GET /api/platform/finance (no auth) -> $pf"
          if [ "$pf" = "404" ]; then
            echo "::error::API still missing /platform/finance - deploy may have failed or wrong path"
            exit 1
          fi
