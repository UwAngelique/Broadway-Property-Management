name: Deploy AOS production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aos-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Build API
        working-directory: backend
        run: npm ci && npm run build
      - name: Build web
        working-directory: frontend
        env:
          API_PROXY_TARGET: http://127.0.0.1:3000
        run: npm ci && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.SSH_HOST != '' && secrets.SSH_USER != '' && secrets.SSH_PRIVATE_KEY != ''
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.DEPLOY_PATH || '/var/www/Broadway-Property-Management' }}"
            export RUN_MIGRATIONS="${{ secrets.RUN_MIGRATIONS || 'false' }}"
            export DEPLOY_BRANCH="main"
            cd "$APP_DIR"
            bash scripts/deploy/deploy.sh

      - name: Smoke test public site
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://broadwaycreation.rw/api/billing/plans)
          echo "GET /api/billing/plans -> $code"
          test "$code" = "200"
          pf=$(curl -s -o /dev/null -w '%{http_code}' http://broadwaycreation.rw/api/platform/finance)
          echo "GET /api/platform/finance (no auth) -> $pf"
          if [ "$pf" = "404" ]; then
            echo "::error::API still missing /platform/finance — deploy may have failed or wrong path"
            exit 1
          fi
