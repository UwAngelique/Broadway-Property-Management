name: Deploy AOS production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-aos-production
  cancel-in-progress: true

env:
  APP_DIR: /var/www/html/Broadway-Property-Management

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, production, broadway]
    steps:
      - name: Pull latest code
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Build and restart backend
        run: |
          set -euo pipefail
          cd "$APP_DIR/backend"
          npm ci
          rm -rf dist
          npm run build
          mkdir -p dist/migrations
          npx tsc migrations/*.ts --target ES2023 --module commonjs --moduleResolution node --esModuleInterop --skipLibCheck --outDir dist/migrations
          BACKEND_ENTRY="$(find dist -name main.js | head -n 1)"
          test -n "$BACKEND_ENTRY"
          pm2 delete broadway-backend || true
          pm2 start "$BACKEND_ENTRY" --name broadway-backend --update-env

      - name: Build and restart frontend
        env:
          API_PROXY_TARGET: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          cd "$APP_DIR/frontend"
          npm ci
          npm run build
          pm2 delete broadway-frontend || true
          pm2 start "npm run start -- -p 3001" --name broadway-frontend --update-env

      - name: Save PM2 process list
        run: pm2 save

      - name: Smoke test local services
        run: |
          wait_for_http() {
            local name="$1"
            local url="$2"
            local expected="$3"

            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              echo "GET $name -> $code (attempt $attempt)"
              if [ "$code" = "$expected" ]; then
                return 0
              fi
              sleep 2
            done

            echo "::error::$name did not return HTTP $expected"
            pm2 logs --lines 80 --nostream || true
            return 1
          }

          wait_for_http "backend /billing/plans" "http://127.0.0.1:3000/billing/plans" "200"
          wait_for_http "frontend /" "http://127.0.0.1:3001/" "200"
